name: Publish Dags

on:
  push:
    branches: [main]
    paths: 
      - 'dag/**' 
      - 'dags/**' 
  workflow_dispatch: 
        
env:
  TARGET_REPO: c2willi/airflow-dag-monorepo
  TARGET_SUBDIR: dags/subrepo-1
  TARGET_BRANCH: develop
  SOURCE_PATH: dag/

jobs:
  publish: 
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout source repo
        uses: actions/checkout@v6
        with:
          path: source
          
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          path: target
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.DAG_PUBLISH_TOKEN }}
          fetch-depth: 0
          
      - name: Sync DAG files
        run: | 
          set -euo pipefail
          src="source/${SOURCE_PATH}"  
          dest="target/${TARGET_SUBDIR}"  
           
          if [ ! -d "$src" ]; then
            echo "Source path '$src' does not exist. Nothing to publish"
            exit 0
          fi

          mkdir -p "$dest"
          rsync -a --delete --exclude='.git' "$src/" "$dest/"                              
      
      - name: Debug - list source and target
        run: | 
          echo "=== source/ ==="
          ls -la source
          echo 
          echo "=== source/dag/ ==="
          ls -la source/dag/ || echo "(no dags/ dir)"

          echo "=== target/ ==="
          ls -la target
          echo 
          echo "=== target/${TARGET_SUBDIR} ==="
          ls -la target/${TARGET_SUBDIR} || echo "(subdir does not exist)"   
        env:
          TARGET_SUBDIR: ${{ env.TARGET_SUBDIR }}
        
      - name: Commit and push
        working-directory: target
        env:
          SRC_REPO: ${{ github.repository }}
          SRC_SHA: ${{ github.sha }}
          SRC_REF: ${{ github.ref_name }}
    
        run: |
          set -euo pipefail

          git config user.name "airflow-dag-publisher[bot]"
          git config user.email "airflow-dag-publisher@bnsf.com"

          git add -A

          if git diff --quiet && git diff --cached --quiet; then
            echo "No DAG changes to publish."
            exit 0
          fi

          echo "::group::files to publish::"
          git diff --cached --name-status
          echo "::end::"
          
          git commit \
            -m "publish(${TARGET_SUBDIR}): ${SRC_REPO}@${SRC_SHA:0:7}" \
            -m "Source repo:    ${SRC_REPO}" \
            -m "Source commit:  ${SRC_SHA}" \
            -m "Source branch:  ${SRC_REF}" 

          for attempt in 1 2 3; do
            if git push origin "${TARGET_BRANCH}"; then 
              echo "Published on attempt ${attempt}."
              exit 0
            fi
            echo "Push attempt ${attempt} failed (likely concurrent push); rebasing."
         
            git fetch origin "${TARGET_BRANCH}"
            git rebase "origin/${TARGET_BRANCH}"
          done
          echo "Failed to publish after 3 attempts." >&2
          exit 1   
